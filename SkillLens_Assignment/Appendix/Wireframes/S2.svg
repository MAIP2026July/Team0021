<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, Arial, Helvetica, sans-serif">
<rect width="1440" height="900" fill="#F4F6F9"/>
<rect x="0" y="0" width="1440" height="64" rx="0" fill="#1F3350" stroke="none"/><text x="40" y="40" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start">SkillLens</text><text x="1280" y="40" font-size="16" font-weight="400" fill="#FFFFFF" text-anchor="start">Reviewer</text><text x="1123" y="40" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start">Browse skills</text><rect x="1123" y="52" width="117" height="3" rx="0" fill="#FFD84D" stroke="none"/><text x="48" y="124" font-size="32" font-weight="700" fill="#1F3350" text-anchor="start">Your results</text><rect x="48" y="144" width="220" height="30" rx="15.0" fill="#1F3350" stroke="none"/><text x="158.0" y="163.66666666666666" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Scenario score 2.3 of 3</text><rect x="282" y="144" width="170" height="30" rx="15.0" fill="#EEF3F9" stroke="none"/><text x="367.0" y="163.66666666666666" font-size="14" font-weight="600" fill="#1F3350" text-anchor="middle">Confidence: High</text><rect x="48" y="196" width="470" height="230" rx="10" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1"/><text x="72" y="234" font-size="18" font-weight="700" fill="#1F3350" text-anchor="start">Skill proficiency</text><text x="72" y="262" font-size="14" font-weight="400" fill="#5B6777" text-anchor="start">Data Structures and Algorithms</text><text x="72" y="310" font-size="40" font-weight="700" fill="#1F3350" text-anchor="start">2.3 of 3</text><text x="72" y="344" font-size="14" font-weight="400" fill="#5B6777" text-anchor="start">Based on 2 of 3 scenarios attempted.</text><text x="72" y="366" font-size="14" font-weight="400" fill="#5B6777" text-anchor="start">Scenarios not yet attempted are not counted.</text><rect x="48" y="446" width="470" height="48" rx="8" fill="#FFFFFF" stroke="#1F3350" stroke-width="1.5"/><text x="283.0" y="476.0" font-size="16" font-weight="600" fill="#1F3350" text-anchor="middle">Request review</text><rect x="548" y="196" width="844" height="160" rx="10" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1"/><text x="572" y="232" font-size="18" font-weight="700" fill="#1F3350" text-anchor="start">O1  Choose the data structure</text><text x="572" y="258" font-size="15" font-weight="600" fill="#1D2733" text-anchor="start">Score 2 of 3</text><rect x="1172" y="210" width="200" height="34" rx="8" fill="#FFFFFF" stroke="#1F3350" stroke-width="1.5"/><text x="1272.0" y="233.0" font-size="16" font-weight="600" fill="#1F3350" text-anchor="middle">Practise this objective</text><rect x="572" y="272" width="796" height="36" rx="6" fill="#FBFCFE" stroke="#D9DEE7" stroke-width="1"/><text x="588" y="295" font-size="14" font-weight="400" fill="#1D2733" text-anchor="start">“I would keep a min-heap of size 10 and a hash map for counts.”</text><text x="572" y="332" font-size="14" font-weight="400" fill="#5B6777" text-anchor="start">To reach the next level: Explain why the heap beats a full sort for each update.</text><rect x="548" y="368" width="844" height="160" rx="10" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1"/><text x="572" y="404" font-size="18" font-weight="700" fill="#1F3350" text-anchor="start">O2  Analyse time complexity</text><text x="572" y="430" font-size="15" font-weight="600" fill="#1D2733" text-anchor="start">Score 1 of 3</text><rect x="1172" y="382" width="200" height="34" rx="8" fill="#FFFFFF" stroke="#1F3350" stroke-width="1.5"/><text x="1272.0" y="405.0" font-size="16" font-weight="600" fill="#1F3350" text-anchor="middle">Practise this objective</text><rect x="572" y="444" width="796" height="36" rx="6" fill="#FBFCFE" stroke="#D9DEE7" stroke-width="1"/><text x="588" y="467" font-size="14" font-weight="400" fill="#1D2733" text-anchor="start">“Each update takes about log n time, which is fast.”</text><text x="572" y="504" font-size="14" font-weight="400" fill="#5B6777" text-anchor="start">To reach the next level: State the cost in terms of K, and say why the heap size matters.</text><rect x="548" y="540" width="844" height="160" rx="10" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1"/><text x="572" y="576" font-size="18" font-weight="700" fill="#1F3350" text-anchor="start">O3  Analyse space complexity</text><text x="572" y="602" font-size="15" font-weight="600" fill="#1D2733" text-anchor="start">Score 3 of 3</text><rect x="572" y="616" width="796" height="36" rx="6" fill="#FBFCFE" stroke="#D9DEE7" stroke-width="1"/><text x="588" y="639" font-size="14" font-weight="400" fill="#1D2733" text-anchor="start">“The map grows with unique items, but the heap stays at K.”</text><text x="572" y="676" font-size="14" font-weight="400" fill="#1F6B3A" text-anchor="start">Next level reached. Keep explaining the trade-off.</text><rect x="548" y="712" width="844" height="160" rx="10" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1"/><text x="572" y="748" font-size="18" font-weight="700" fill="#1F3350" text-anchor="start">O4  Explain trade-offs and limits</text><text x="572" y="774" font-size="15" font-weight="600" fill="#1D2733" text-anchor="start">Score 1 of 3</text><rect x="1172" y="726" width="200" height="34" rx="8" fill="#FFFFFF" stroke="#1F3350" stroke-width="1.5"/><text x="1272.0" y="749.0" font-size="16" font-weight="600" fill="#1F3350" text-anchor="middle">Practise this objective</text><rect x="572" y="788" width="796" height="36" rx="6" fill="#FBFCFE" stroke="#D9DEE7" stroke-width="1"/><text x="588" y="811" font-size="14" font-weight="400" fill="#1D2733" text-anchor="start">“The approach is good for most cases.”</text><text x="572" y="848" font-size="14" font-weight="400" fill="#5B6777" text-anchor="start">To reach the next level: Name one case where the top-10 result could be wrong, such as ties.</text><text x="720.0" y="872" font-size="13" font-weight="400" fill="#5B6777" text-anchor="middle">Development guidance, not a performance rating.</text>
</svg>
