<rect x="0" y="0" width="1440" height="64" rx="0" fill="#1F3350" stroke="none"/><text x="40" y="40" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start">SkillLens</text><text x="1280" y="40" font-size="16" font-weight="400" fill="#FFFFFF" text-anchor="start">Reviewer</text><text x="1123" y="40" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start">Browse skills</text><rect x="1123" y="52" width="117" height="3" rx="0" fill="#FFD84D" stroke="none"/><text x="48" y="124" font-size="28" font-weight="700" fill="#1F3350" text-anchor="start">Objective: Analyse time complexity</text><rect x="48" y="160" width="520" height="80" rx="10" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1"/><text x="72" y="208" font-size="20" font-weight="700" fill="#1F3350" text-anchor="start">First attempt: 1 of 3</text><text x="308" y="330" font-size="18" font-weight="700" fill="#1F6B3A" text-anchor="middle">▲ Up 1 level</text><rect x="48" y="352" width="520" height="80" rx="10" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1"/><text x="72" y="400" font-size="20" font-weight="700" fill="#1F3350" text-anchor="start">Follow-up: 2 of 3</text><rect x="620" y="160" width="772" height="260" rx="10" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1"/><text x="644" y="204" font-size="18" font-weight="700" fill="#1F3350" text-anchor="start">Your follow-up</text><rect x="644" y="222" width="724" height="110" rx="8" fill="#FBFCFE" stroke="#D9DEE7" stroke-width="1"/><text x="664" y="262" font-size="15" font-weight="400" fill="#1D2733" text-anchor="start">“Each update costs about log K, because the heap holds only K items.”</text><text x="664" y="292" font-size="15" font-weight="400" fill="#1D2733" text-anchor="start">The memory stays at K, so the cost does not grow with traffic.</text><text x="644" y="364" font-size="14" font-weight="400" fill="#5B6777" text-anchor="start">To reach the next level: say how the bound changes if K grows.</text><rect x="620" y="448" width="340" height="48" rx="8" fill="#FFFFFF" stroke="#1F3350" stroke-width="1.5"/><text x="790.0" y="478.0" font-size="16" font-weight="600" fill="#1F3350" text-anchor="middle">Practise another objective</text><rect x="980" y="448" width="200" height="48" rx="8" fill="#1F3350" stroke="#1F3350" stroke-width="1"/><text x="1080.0" y="478.0" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Done</text><text x="720.0" y="872" font-size="13" font-weight="400" fill="#5B6777" text-anchor="middle">Development guidance, not a performance rating.</text>
