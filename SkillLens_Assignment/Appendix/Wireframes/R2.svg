<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, Arial, Helvetica, sans-serif">
<rect width="1440" height="900" fill="#F4F6F9"/>
<rect x="0" y="0" width="1440" height="64" rx="0" fill="#1F3350" stroke="none"/><text x="40" y="40" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start">SkillLens</text><text x="1289" y="40" font-size="16" font-weight="400" fill="#FFFFFF" text-anchor="start">Reports</text><text x="1168" y="40" font-size="16" font-weight="400" fill="#FFFFFF" text-anchor="start">Authoring</text><text x="993" y="40" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start">Review requests</text><rect x="993" y="52" width="135" height="3" rx="0" fill="#FFD84D" stroke="none"/><rect x="48" y="124" width="560" height="760" rx="10" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1"/><text x="72" y="164" font-size="18" font-weight="700" fill="#1F3350" text-anchor="start">Learner response</text><text x="72" y="204" font-size="15" font-weight="400" fill="#1D2733" text-anchor="start">I would keep a min-heap of size 10 and a hash map for counts,</text><rect x="160" y="214" width="194" height="20" rx="3" fill="#FFF1C2" stroke="none"/><text x="72" y="230" font-size="15" font-weight="400" fill="#1D2733" text-anchor="start">so I never sort all items.</text><text x="72" y="270" font-size="15" font-weight="400" fill="#1D2733" text-anchor="start">Each update takes about log 10 time, which is fast enough.</text><rect x="72" y="282" width="430" height="20" rx="3" fill="#FFF1C2" stroke="none"/><text x="72" y="316" font-size="15" font-weight="400" fill="#1D2733" text-anchor="start">The map grows with unique items, but the heap stays at K.</text><rect x="72" y="330" width="420" height="20" rx="3" fill="#FFF1C2" stroke="none"/><rect x="72" y="380" width="480" height="9" rx="4" fill="#C9D2DE" stroke="none"/><rect x="72" y="406" width="420" height="9" rx="4" fill="#C9D2DE" stroke="none"/><rect x="72" y="432" width="360" height="9" rx="4" fill="#C9D2DE" stroke="none"/><rect x="72" y="458" width="480" height="9" rx="4" fill="#C9D2DE" stroke="none"/><rect x="72" y="484" width="420" height="9" rx="4" fill="#C9D2DE" stroke="none"/><rect x="72" y="510" width="360" height="9" rx="4" fill="#C9D2DE" stroke="none"/><rect x="640" y="124" width="752" height="760" rx="10" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1"/><text x="664" y="164" font-size="18" font-weight="700" fill="#1F3350" text-anchor="start">AI scoring</text><text x="664" y="200" font-size="14" font-weight="700" fill="#1F3350" text-anchor="start">Objective</text><text x="980" y="200" font-size="14" font-weight="700" fill="#1F3350" text-anchor="start">Score</text><text x="1070" y="200" font-size="14" font-weight="700" fill="#1F3350" text-anchor="start">Verified</text><text x="1170" y="200" font-size="14" font-weight="700" fill="#1F3350" text-anchor="start">Runs</text><rect x="664" y="218" width="704" height="36" rx="0" fill="#FFFFFF" stroke="none"/><rect x="664" y="253" width="704" height="1" rx="0" fill="#D9DEE7" stroke="none"/><text x="664" y="241" font-size="14" font-weight="400" fill="#1D2733" text-anchor="start">O1 Choose the data structure</text><text x="980" y="241" font-size="14" font-weight="700" fill="#1D2733" text-anchor="start">2</text><text x="1070" y="241" font-size="14" font-weight="400" fill="#1F6B3A" text-anchor="start">✓ Yes</text><text x="1170" y="241" font-size="14" font-weight="400" fill="#1D2733" text-anchor="start">3 of 3</text><rect x="664" y="260" width="704" height="36" rx="0" fill="#FFFFFF" stroke="none"/><rect x="664" y="295" width="704" height="1" rx="0" fill="#D9DEE7" stroke="none"/><text x="664" y="283" font-size="14" font-weight="400" fill="#1D2733" text-anchor="start">O2 Analyse time complexity</text><text x="980" y="283" font-size="14" font-weight="700" fill="#1D2733" text-anchor="start">1</text><text x="1070" y="283" font-size="14" font-weight="400" fill="#1F6B3A" text-anchor="start">✓ Yes</text><text x="1170" y="283" font-size="14" font-weight="400" fill="#1D2733" text-anchor="start">2 of 3</text><rect x="664" y="302" width="704" height="36" rx="0" fill="#FFFFFF" stroke="none"/><rect x="664" y="337" width="704" height="1" rx="0" fill="#D9DEE7" stroke="none"/><text x="664" y="325" font-size="14" font-weight="400" fill="#1D2733" text-anchor="start">O3 Analyse space complexity</text><text x="980" y="325" font-size="14" font-weight="700" fill="#1D2733" text-anchor="start">3</text><text x="1070" y="325" font-size="14" font-weight="400" fill="#1F6B3A" text-anchor="start">✓ Yes</text><text x="1170" y="325" font-size="14" font-weight="400" fill="#1D2733" text-anchor="start">3 of 3</text><rect x="664" y="344" width="704" height="36" rx="0" fill="#FFFFFF" stroke="none"/><rect x="664" y="379" width="704" height="1" rx="0" fill="#D9DEE7" stroke="none"/><text x="664" y="367" font-size="14" font-weight="400" fill="#1D2733" text-anchor="start">O4 Explain trade-offs and limits</text><text x="980" y="367" font-size="14" font-weight="700" fill="#1D2733" text-anchor="start">1</text><text x="1070" y="367" font-size="14" font-weight="400" fill="#1F6B3A" text-anchor="start">✓ Yes</text><text x="1170" y="367" font-size="14" font-weight="400" fill="#1D2733" text-anchor="start">2 of 3</text><text x="664" y="420" font-size="16" font-weight="700" fill="#1F3350" text-anchor="start">Decision</text><text x="664" y="464" font-size="14" font-weight="700" fill="#1D2733" text-anchor="start">O1</text><circle cx="716" cy="459" r="8" fill="#FFFFFF" stroke="#1F3350" stroke-width="1.5"/><text x="736" y="464" font-size="14" font-weight="400" fill="#1D2733" text-anchor="start">Confirm</text><circle cx="840" cy="459" r="8" fill="#FFFFFF" stroke="#1F3350" stroke-width="1.5"/><text x="860" y="464" font-size="14" font-weight="400" fill="#1D2733" text-anchor="start">Override to</text><rect x="980" y="444" width="60" height="32" rx="6" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1"/><text x="1010" y="465" font-size="14" font-weight="400" fill="#1D2733" text-anchor="middle">2</text><text x="664" y="508" font-size="14" font-weight="700" fill="#1D2733" text-anchor="start">O2</text><circle cx="716" cy="503" r="8" fill="#FFFFFF" stroke="#1F3350" stroke-width="1.5"/><text x="736" y="508" font-size="14" font-weight="400" fill="#1D2733" text-anchor="start">Confirm</text><circle cx="840" cy="503" r="8" fill="#FFFFFF" stroke="#1F3350" stroke-width="1.5"/><text x="860" y="508" font-size="14" font-weight="400" fill="#1D2733" text-anchor="start">Override to</text><rect x="980" y="488" width="60" height="32" rx="6" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1"/><text x="1010" y="509" font-size="14" font-weight="400" fill="#1D2733" text-anchor="middle">2</text><text x="664" y="552" font-size="14" font-weight="700" fill="#1D2733" text-anchor="start">O3</text><circle cx="716" cy="547" r="8" fill="#FFFFFF" stroke="#1F3350" stroke-width="1.5"/><text x="736" y="552" font-size="14" font-weight="400" fill="#1D2733" text-anchor="start">Confirm</text><circle cx="840" cy="547" r="8" fill="#FFFFFF" stroke="#1F3350" stroke-width="1.5"/><text x="860" y="552" font-size="14" font-weight="400" fill="#1D2733" text-anchor="start">Override to</text><rect x="980" y="532" width="60" height="32" rx="6" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1"/><text x="1010" y="553" font-size="14" font-weight="400" fill="#1D2733" text-anchor="middle">2</text><text x="664" y="596" font-size="14" font-weight="700" fill="#1D2733" text-anchor="start">O4</text><circle cx="716" cy="591" r="8" fill="#FFFFFF" stroke="#1F3350" stroke-width="1.5"/><text x="736" y="596" font-size="14" font-weight="400" fill="#1D2733" text-anchor="start">Confirm</text><circle cx="840" cy="591" r="8" fill="#FFFFFF" stroke="#1F3350" stroke-width="1.5"/><text x="860" y="596" font-size="14" font-weight="400" fill="#1D2733" text-anchor="start">Override to</text><rect x="980" y="576" width="60" height="32" rx="6" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1"/><text x="1010" y="597" font-size="14" font-weight="400" fill="#1D2733" text-anchor="middle">2</text><text x="664" y="624" font-size="14" font-weight="700" fill="#1F3350" text-anchor="start">Reason for override (required)</text><rect x="664" y="636" width="704" height="60" rx="8" fill="#FBFCFE" stroke="#D9DEE7" stroke-width="1"/><text x="664" y="724" font-size="14" font-weight="700" fill="#1F3350" text-anchor="start">Comment for learner (optional, shown on their result)</text><rect x="664" y="736" width="704" height="50" rx="8" fill="#FBFCFE" stroke="#D9DEE7" stroke-width="1"/><text x="664" y="806" font-size="13" font-weight="400" fill="#5B6777" text-anchor="start">Do not include personal details.</text><rect x="1170" y="828" width="110" height="40" rx="8" fill="#FFFFFF" stroke="#1F3350" stroke-width="1.5"/><text x="1225.0" y="854.0" font-size="16" font-weight="600" fill="#1F3350" text-anchor="middle">Cancel</text><rect x="1290" y="828" width="110" height="40" rx="8" fill="#1F3350" stroke="#1F3350" stroke-width="1"/><text x="1345.0" y="854.0" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Save</text><rect x="1200" y="140" width="150" height="28" rx="14.0" fill="#FFF1D6" stroke="none"/><text x="1275.0" y="158.33333333333334" font-size="13" font-weight="600" fill="#7A4F00" text-anchor="middle">Pending</text>
