<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, Arial, Helvetica, sans-serif">
<rect width="1440" height="900" fill="#F4F6F9"/>
<rect x="0" y="0" width="1440" height="64" rx="0" fill="#1F3350" stroke="none"/><text x="40" y="40" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start">SkillLens</text><text x="1280" y="40" font-size="16" font-weight="400" fill="#FFFFFF" text-anchor="start">Reviewer</text><text x="1123" y="40" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start">Browse skills</text><rect x="1123" y="52" width="117" height="3" rx="0" fill="#FFD84D" stroke="none"/><text x="48" y="112" font-size="15" font-weight="400" fill="#5B6777" text-anchor="start">Browse skills › Data Structures and Algorithms › Scenario 1 of 3</text><text x="48" y="160" font-size="28" font-weight="700" fill="#1F3350" text-anchor="start">The High-Traffic Flash Sale</text><rect x="48" y="180" width="520" height="300" rx="10" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1"/><text x="72" y="218" font-size="15" font-weight="400" fill="#1D2733" text-anchor="start">You are engineering the backend for a flash sale with a live</text><text x="72" y="244" font-size="15" font-weight="400" fill="#1D2733" text-anchor="start">leaderboard of the top 10 best-selling items. Sorting after every</text><text x="72" y="270" font-size="15" font-weight="400" fill="#1D2733" text-anchor="start">purchase is too slow. Which data structure and algorithm maintain</text><text x="72" y="296" font-size="15" font-weight="400" fill="#1D2733" text-anchor="start">the top 10 efficiently, and what is the time complexity of an</text><text x="72" y="322" font-size="15" font-weight="400" fill="#1D2733" text-anchor="start">incoming purchase event?</text><rect x="72" y="350" width="440" height="9" rx="4" fill="#C9D2DE" stroke="none"/><rect x="72" y="372" width="380" height="9" rx="4" fill="#C9D2DE" stroke="none"/><rect x="72" y="394" width="320" height="9" rx="4" fill="#C9D2DE" stroke="none"/><rect x="48" y="500" width="520" height="200" rx="10" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1"/><text x="72" y="536" font-size="16" font-weight="700" fill="#1F3350" text-anchor="start">You will be assessed on</text><text x="72" y="574" font-size="15" font-weight="400" fill="#1D2733" text-anchor="start">•  Choose the right data structure</text><text x="72" y="608" font-size="15" font-weight="400" fill="#1D2733" text-anchor="start">•  Analyse time complexity</text><text x="72" y="642" font-size="15" font-weight="400" fill="#1D2733" text-anchor="start">•  Analyse space complexity</text><text x="72" y="676" font-size="15" font-weight="400" fill="#1D2733" text-anchor="start">•  Explain trade-offs and limits</text><rect x="600" y="130" width="792" height="650" rx="10" fill="#FFFFFF" stroke="#D9DEE7" stroke-width="1"/><text x="628" y="172" font-size="18" font-weight="700" fill="#1F3350" text-anchor="start">Your response</text><rect x="628" y="190" width="736" height="530" rx="8" fill="#FBFCFE" stroke="#D9DEE7" stroke-width="1"/><text x="1352" y="748" font-size="14" font-weight="400" fill="#5B6777" text-anchor="end">Words: 0</text><text x="628" y="808" font-size="14" font-weight="400" fill="#5B6777" text-anchor="start">Explain your reasoning and the steps you would take.</text><rect x="1192" y="820" width="200" height="48" rx="8" fill="#1F3350" stroke="#1F3350" stroke-width="1"/><text x="1292.0" y="850.0" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Submit</text><text x="720.0" y="872" font-size="13" font-weight="400" fill="#5B6777" text-anchor="middle">Development guidance, not a performance rating.</text>
</svg>
